name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: vocap_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: vocap_app
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp vocap_app/build/app/outputs/flutter-apk/app-release.apk release-assets/vocap-${{ github.ref_name || 'v1.0.0' }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Vocap ${{ github.ref_name || 'v1.0.0' }} - Oxford 5000 IELTS"
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.apk
