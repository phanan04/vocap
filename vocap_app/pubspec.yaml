name: vocap_app
description: "Vocap - IELTS Spaced Repetition Vocabulary Learning App"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Database
  supabase_flutter: ^2.8.0

  # Audio Streaming & Playback
  audioplayers: ^6.1.0

  # State Management
  flutter_riverpod: ^2.6.1

  # UI Components & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_card_swiper: ^7.0.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  http: ^1.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
